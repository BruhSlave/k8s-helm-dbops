apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresdb
  labels:
    app.kubernetes.io/name: "postgresdb"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/component: "database"
    app.kubernetes.io/part-of: "sausage-store"
    env: "{{ .Values.global.environment }}"
  annotations:
    helm.sh/hook-weight: "-5"
spec:
  serviceName: postgresdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "postgresdb"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: "database"
        app.kubernetes.io/part-of: "sausage-store"
        env: "{{ .Values.global.environment }}"
    spec:
      containers:
        - name: postgresdb
          image: {{ .Values.postgresql.image }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - configMapRef:
                name: postgresdb-conf
            - secretRef:
                name: postgresdb-secret
          ports:
            - containerPort: {{ .Values.postgresql.env.POSTGRES_PORT }}
          resources:
            {{ toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: postgresdb-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgresdb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresdb
  labels:
    app.kubernetes.io/name: "postgresdb"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    app.kubernetes.io/component: "database"
    app.kubernetes.io/part-of: "sausage-store"
    env: "{{ .Values.global.environment }}"
spec:
  ports:
    - port: {{ .Values.postgresql.env.POSTGRES_PORT }}
      targetPort: {{ .Values.postgresql.env.POSTGRES_PORT }}
  selector:
    app.kubernetes.io/name: postgresdb
  clusterIP: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresdb-conf
  labels:
    app.kubernetes.io/name: "postgresdb"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: "database"
    app.kubernetes.io/part-of: "sausage-store"
    env: "{{ .Values.global.environment }}"
data:
  POSTGRES_DB: {{ .Values.postgresql.env.POSTGRES_DB }}
  POSTGRES_USER: {{ .Values.postgresql.env.POSTGRES_USER }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresdb-secret
  labels:
    app.kubernetes.io/name: "postgresdb"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: "database"
    app.kubernetes.io/part-of: "sausage-store"
    env: "{{ .Values.global.environment }}"
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.env.POSTGRES_PASSWORD }}
