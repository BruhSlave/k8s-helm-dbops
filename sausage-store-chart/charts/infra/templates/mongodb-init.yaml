apiVersion: batch/v1
kind: Job
metadata: 
  name: {{ .Release.Name }}-mongodb-init
    labels:
      app.kubernetes.io/name: "{{ .Release.Name}}-mongodb-init"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
      app.kubernetes.io/managed-by: "{{ .Release.Service }}"
      helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
      app.kubernetes.io/component: "database-init"
      app.kubernetes.io/part-of: "sausage-store"
      env: "{{ .Values.global.environment }}"
  annotations:
    helm.sh/hook: "post-install,post-upgrade"
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: "before-hook-creation"
    
spec:
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-mongodb-init"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: "database-init"
        app.kubernetes.io/part-of: "sausage-store"
        env: "{{ .Values.global.environment }}"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: {{ .Release.Name }}-mongodb-init
          image: {{ .Values.mongodb.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - secretRef: 
                name: mongodb-secret
            - secretRef:
                name: mongodb-init-secret
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              for i in $(seq 1 30); do
                echo "Attempt $i"

                if mongosh \
                    "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/admin" \
                    --quiet \
                    --eval 'db.runCommand({ ping: 1 }).ok'
                then
                  echo "MongoDB is ready"
                  break
                fi

                sleep 5
              done

              mongosh "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:{{ .Values.mongodb.containerPort }}/admin" --quiet --eval '
                const dbName = process.env.MONGO_INITDB_ROOT_DATABASE;
                const username = process.env.MONGO_REPORT_USERNAME;
                const password = process.env.MONGO_REPORT_PASSWORD;
                const reportsDb = db.getSiblingDB(dbName);
                const roles = [{ role: "readWrite", db: dbName }];

                if (reportsDb.getUser(username)) {
                  reportsDb.updateUser(username, { pwd: password, roles });
                } else {
                  reportsDb.createUser({ user: username, pwd: password, roles });
                }
              '
          resources:
            {{- toYaml (index .Values "mongodb-init" "resources") | nindent 12 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-init-secret
    labels:
      app.kubernetes.io/name: "mongodb-init-secret"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/managed-by: "{{ .Release.Service }}"
      app.kubernetes.io/component: "database"
      app.kubernetes.io/part-of: "sausage-store"
      env: "{{ .Values.global.environment }}"
type: Opaque
stringData:
  MONGO_REPORT_USERNAME: {{ .Values.mongodb.env.MONGO_REPORT_USERNAME }}
  MONGO_REPORT_PASSWORD: {{ .Values.mongodb.env.MONGO_REPORT_PASSWORD }}
  MONGO_INITDB_ROOT_DATABASE: {{ .Values.mongodb.env.MONGO_INITDB_ROOT_DATABASE }}
